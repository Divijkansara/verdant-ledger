<body>

<a href="#root" class="skip">Skip to content</a>
<style>
  .skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--accent);
    color:var(--on-accent);padding:10px 16px;border-radius:0 0 var(--r-sm) 0;font-weight:600}
  .skip:focus{left:0}
  #boot{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:var(--bg);
    transition:opacity .4s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .b-in{text-align:center}
  #boot .b-mark{width:42px;height:42px;margin:0 auto 16px;animation:bootPulse 1.6s ease-in-out infinite}
  @keyframes bootPulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
  #boot .b-txt{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--text-3)}
</style>

<!-- First paint: the theme engine runs before this is removed, so the app
     never flashes an unthemed frame. -->
<div id="boot">
  <div class="b-in">
    <svg class="b-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="12" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="62 13.4"
        stroke-linecap="round" transform="rotate(-16 16 16)"/>
      <path d="M9 23 C9 13.5 15.5 7 25.5 6.5 C25 16.5 18.5 23 9 23 Z" fill="var(--good)"/>
      <path d="M9 23 L19 13" stroke="var(--bg, #071e22)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <div class="b-txt">Terrawise · loading</div>
  </div>
</div>

<div id="root"></div>

<!-- ══════════════════════ overlays ══════════════════════ -->
<div id="palette" role="dialog" aria-modal="true" aria-label="Command palette">

    <input type="text" placeholder="Type a command — post an entry, change the theme, export…"
      aria-label="Command" autocomplete="off">
    <div class="pal-list" role="listbox"></div>
  </div>
</div>

<div id="modal"></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <div style="max-width:640px;margin:80px auto;padding:0 24px">
    <h1>JavaScript is required</h1>
    <p style="color:var(--text-2);margin-top:12px;line-height:1.7">
      Terrawise computes every figure in the browser — the emission engine, the SHA-256
      ledger chain, the anomaly detector and the colour system all run client-side. The
      methodology and the emission factor catalogue are documented in
      <code>backend/docs/</code> if you need them without scripting.</p>
  </div>
</noscript>

<!-- ══════════════════════ scripts ══════════════════════
     Classic scripts in dependency order rather than ES modules: modules
     are blocked over file://, and this application has to run from a
     double-click with no server. -->

<script defer src="js/chain.js"></script>

<script defer src="js/views-app.js"></script>
<script defer src="js/tour.js"></script>
<script defer src="js/earth-land.js"></script>
<script defer src="js/shader.js"></script>
<script defer src="js/deck.js"></script>
<script defer src="js/fx.js"></script>
<script defer src="js/app.js"></script>
<script>
  /* Clear the boot screen as soon as the app has painted. It must NOT
     wait on window.load: one slow webfont request would leave a visitor
     staring at an empty screen on a bad connection or a lab machine. */
  (function () {
    var cleared = false;
    function clearBoot() {
      if (cleared) return;
      cleared = true;
      var boot = document.getElementById("boot");
      if (!boot) return;
      boot.classList.add("gone");
      setTimeout(function () { boot.remove(); }, 450);
    }
    document.addEventListener("DOMContentLoaded", function () { setTimeout(clearBoot, 150); });
    window.addEventListener("load", clearBoot);
    setTimeout(clearBoot, 2500);          // hard backstop
  })();
</script>
